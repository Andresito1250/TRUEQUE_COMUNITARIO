name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: trueque
          POSTGRES_PASSWORD: trueque
          POSTGRES_DB: trueque
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trueque -d trueque"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://trueque:trueque@localhost:5432/trueque?schema=public
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      S3_ENDPOINT: http://localhost:8333
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build:shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Almacenamiento S3 (SeaweedFS)
        run: |
          docker run -d -p 8333:8333 chrislusf/seaweedfs:4.54 server -dir=/data -s3 -s3.port=8333
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8333 && break; sleep 2; done
      - name: Migraciones y pruebas e2e del API
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npm run test:cobertura
